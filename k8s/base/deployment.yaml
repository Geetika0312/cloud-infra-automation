apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-infra-demo-api
  namespace: cloud-infra-demo
  labels:
    app: cloud-infra-demo-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # allowed to spin up 1 extra pod above `replicas` while updating
      maxUnavailable: 0 # never drop below `replicas` ready pods during an update
  selector:
    matchLabels:
      app: cloud-infra-demo-api
  template:
    metadata:
      labels:
        app: cloud-infra-demo-api
    spec:
      containers:
        - name: api
          image: acrcloudinfradev290062.azurecr.io/cloud-infra-demo-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
